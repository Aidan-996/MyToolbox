# Linux 版编译与端到端冒烟测试（Windows 版在 Ua/，不受此工作流影响）
name: linux-build

on:
  push:
    branches: [main]
    paths: ["linux/**", "Ua/prompts/**", "Ua/skills/**", ".github/workflows/linux.yml"]
  pull_request:
    paths: ["linux/**", ".github/workflows/linux.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make -C linux CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Werror"

      - name: Smoke test (fake HOME, end to end)
        run: |
          set -e
          cd linux
          export HOME="$(mktemp -d)"
          export UA_DATA="$HOME/.local/share/ua"
          mkdir -p "$UA_DATA"
          cp -r ../Ua/prompts ../Ua/skills "$UA_DATA/"

          ./ua version
          ./ua list

          # 注入 -> 文件存在且非空
          ./ua install claude ../Ua/prompts/Ua-standard-pro.md
          test -s "$HOME/.claude/CLAUDE.md"

          # 卸载 -> 原本不存在，恢复后应删除
          ./ua uninstall claude
          test ! -e "$HOME/.claude/CLAUDE.md"

          # 有原文件时卸载应恢复原内容
          mkdir -p "$HOME/.codex"
          echo "original rules" > "$HOME/.codex/AGENTS.md"
          ./ua install codex ../Ua/prompts/Ua-standard-pro.md
          test -s "$HOME/.codex/AGENTS.md"
          ./ua uninstall codex
          grep -q "original rules" "$HOME/.codex/AGENTS.md"

          # Skills 全装 -> 全卸
          ./ua skills install claude
          test -s "$HOME/.claude/skills/radare2/SKILL.md"
          ./ua skills uninstall claude
          test ! -e "$HOME/.claude/skills/radare2/SKILL.md"

          # 单个技能装/卸
          ./ua skills install claude radare2
          test -s "$HOME/.claude/skills/radare2/SKILL.md"
          ./ua skills uninstall claude radare2
          test ! -e "$HOME/.claude/skills/radare2/SKILL.md"

          echo "smoke test passed"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ua-linux-x64
          path: linux/ua
