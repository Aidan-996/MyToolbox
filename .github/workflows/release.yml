# 推送 v* tag 时自动构建三平台二进制并发布 Release。
# 应用内的更新检查走 /releases/latest/download/MyBox.exe，资产名必须保持 MyBox.exe。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build (x64 Release)
        run: msbuild MyBox/MyBox.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m /nologo /v:m
      - uses: actions/upload-artifact@v4
        with:
          name: MyBox-windows-x64
          path: MyBox/x64/Release/MyBox.exe

  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, artifact: mybox-linux-x64, extra: "" }
          - { os: macos-latest, artifact: mybox-macos-universal, extra: "-arch arm64 -arch x86_64" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -C cli CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Werror ${{ matrix.extra }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: cli/mybox

  publish:
    needs: [windows, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MyBox-windows-x64
          path: rel/
      - uses: actions/download-artifact@v4
        with:
          name: mybox-linux-x64
          path: rel/
      - uses: actions/download-artifact@v4
        with:
          name: mybox-macos-universal
          path: rel/
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rel/MyBox.exe
            rel/mybox-linux-x64
            rel/mybox-macos-universal
          generate_release_notes: true
